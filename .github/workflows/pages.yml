# Hospedagem alternativa (HTTPS) no GitHub Pages. A principal é a Vercel (vercel.json).
# Observação: o Pages não aplica cabeçalhos customizados (CSP etc.); use a Vercel em produção.
# Uso: habilite Settings › Pages › Source: "GitHub Actions" (o GITHUB_TOKEN não pode habilitar
# o Pages sozinho) e rode este workflow em Actions › Deploy GitHub Pages › Run workflow.
name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
